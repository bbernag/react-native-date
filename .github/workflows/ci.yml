name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
  schedule:
    # Nightly Expo prebuild (and the rest of CI) at 05:17 UTC.
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Assert GitHub Actions are SHA-pinned
        run: |
          set -euo pipefail
          if grep -R --include='*.yml' --include='*.yaml' -nE 'uses:[[:space:]]+[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@(v[0-9]|main|master|latest)' .github; then
            echo '::error::Action references must be pinned to a full 40-character SHA with a version comment'
            exit 1
          fi

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: yarn workspace @bernagl/react-native-date lint

      - name: Type check
        run: yarn workspace @bernagl/react-native-date typecheck

      - name: Run tests
        run: yarn workspace @bernagl/react-native-date test

      - name: Build
        run: yarn workspace @bernagl/react-native-date prepare

      - name: Production dependency audit
        continue-on-error: true
        run: yarn npm audit --environment production

  cpp-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Configure (ASan + UBSan)
        working-directory: packages/native-date
        run: cmake -S cpp-tests -B cpp-tests/build -DCMAKE_BUILD_TYPE=Debug -DNATIVEDATE_SANITIZE=ON

      - name: Build
        working-directory: packages/native-date
        run: cmake --build cpp-tests/build

      - name: Run core unit tests
        working-directory: packages/native-date
        run: ctest --test-dir cpp-tests/build --output-on-failure

  build-android:
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Pin Android NDK 27.1
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Build library
        run: yarn workspace @bernagl/react-native-date prepare

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Build Android example
        working-directory: packages/example/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-logs-${{ github.run_id }}
          path: |
            packages/example/android/**/build/outputs/
            packages/example/android/**/build/reports/
            packages/example/android/.cxx/
            packages/native-date/android/.cxx/
            packages/native-date/android/build/
          if-no-files-found: warn
          retention-days: 7

  build-ios:
    runs-on: macos-latest
    needs: lint-and-test
    permissions:
      contents: read
    env:
      XCODE_VERSION: '16.3'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build library
        run: yarn workspace @bernagl/react-native-date prepare

      - name: Cache CocoaPods
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            packages/example/ios/Pods
            packages/example/vendor/bundle
          key: ${{ runner.os }}-pods-${{ hashFiles('packages/example/ios/Podfile.lock', 'packages/example/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Ruby gems
        working-directory: packages/example
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Install CocoaPods
        working-directory: packages/example
        run: bundle exec pod install --project-directory=ios --deployment

      - name: Build iOS example
        working-directory: packages/example/ios
        run: |
          xcodebuild \
            -workspace NativeDateExample.xcworkspace \
            -scheme NativeDateExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -resultBundlePath "$RUNNER_TEMP/NativeDateExample.xcresult" \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/NativeDateExample.xcresult
          if-no-files-found: warn
          retention-days: 7

  expo-prebuild:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Pin Android NDK 27.1
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        with:
          ndk-version: r27b
          link-to-sdk: true

      - name: Build library
        run: yarn workspace @bernagl/react-native-date prepare

      - name: Expo prebuild
        working-directory: packages/expo-example
        run: yarn expo prebuild --no-install

      - name: Assemble Expo Android
        working-directory: packages/expo-example/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Upload Expo Android build logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: expo-android-build-logs-${{ github.run_id }}
          path: |
            packages/expo-example/android/**/build/outputs/
            packages/expo-example/android/**/build/reports/
            packages/expo-example/android/.cxx/
          if-no-files-found: warn
          retention-days: 7
